<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Zypher | Post-quantum cryptographic discovery for Windows</title>
    <meta
      name="description"
      content="Zypher finds every piece of cryptography in your code, binaries, dependencies and certificates, scores its quantum risk and dates your FIPS 203/204/205 migration. Fully offline."
    />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0e12" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Zypher" />
    <meta
      property="og:description"
      content="Cryptographic discovery and post-quantum migration intelligence, offline."
    />
    <meta property="og:image" content="https://prabhu-omkar.github.io/Zypher-website/og.jpg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem('zypher-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
